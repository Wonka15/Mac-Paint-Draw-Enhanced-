<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="description" content="A friendly, classic-Mac-inspired paint and drawing studio for the modern web.">
  <title>Mac paint/draw enhanced</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">✎</div>
        <div>
          <h1>Mac paint/draw enhanced</h1>
          <p>A little classic Mac magic. A lot more room to create.</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn secondary" id="newBtn">＋ New</button>
        <button class="btn secondary" id="undoBtn" disabled>↶ Undo</button>
        <button class="btn secondary" id="redoBtn" disabled>↷ Redo</button>
        <button class="btn secondary" id="exportSvgBtn">Export SVG · Vinyl</button>
        <button class="btn primary" id="exportBtn">Export PNG ↗</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel leftpanel">
        <h2>Toolbox</h2>
        <div class="toolgrid" id="toolgrid">
          <button class="tool active" data-tool="pencil"><span class="ico">✎</span>Pencil</button>
          <button class="tool" data-tool="eraser"><span class="ico">▱</span>Eraser</button>
          <button class="tool" data-tool="line"><span class="ico">／</span>Line</button>
          <button class="tool" data-tool="rect"><span class="ico">▱</span>Rectangle</button>
          <button class="tool" data-tool="ellipse"><span class="ico">◯</span>Oval</button>
          <button class="tool" data-tool="text"><span class="ico">T</span>Text</button>
          <button class="tool" data-tool="eyedropper"><span class="ico">◉</span>Pick color</button>
          <button class="tool" data-tool="hand"><span class="ico">✋</span>Pan / guide</button>
          <button class="tool" data-tool="pen"><span class="ico">⌁</span>Vector pen</button>
          <button class="tool" data-tool="editpoints"><span class="ico">◇</span>Edit points</button>
        </div>

        <div class="separator"></div>

        <h2>Quick palette</h2>
        <div class="palette" id="palette">
          <button class="swatch" style="background:#20252b" data-color="#20252b" aria-label="Ink black"></button>
          <button class="swatch" style="background:#ffffff" data-color="#ffffff" aria-label="White"></button>
          <button class="swatch" style="background:#d84b42" data-color="#d84b42" aria-label="Red"></button>
          <button class="swatch" style="background:#ed9c35" data-color="#ed9c35" aria-label="Orange"></button>
          <button class="swatch" style="background:#f0cf4c" data-color="#f0cf4c" aria-label="Yellow"></button>
          <button class="swatch" style="background:#4d956d" data-color="#4d956d" aria-label="Green"></button>
          <button class="swatch" style="background:#48a7bc" data-color="#48a7bc" aria-label="Teal"></button>
          <button class="swatch" style="background:#426bd6" data-color="#426bd6" aria-label="Blue"></button>
          <button class="swatch" style="background:#9271c7" data-color="#9271c7" aria-label="Purple"></button>
          <button class="swatch" style="background:#000000" data-color="#000000" aria-label="Black"></button>
          <button class="swatch" style="background:#7a7a7a" data-color="#7a7a7a" aria-label="Gray"></button>
          <button class="swatch" style="background:#f1d4c5" data-color="#f1d4c5" aria-label="Pink"></button>
        </div>
      </aside>

      <section class="canvas-shell">
        <div class="canvasbar">
          <div><strong id="docTitle">Untitled drawing</strong> <span class="hint">· Your canvas</span></div>
          <div class="controlrow">
            <button class="btn secondary" id="guidesBtn">Guides</button>
            <button class="btn secondary" id="gridBtn">Grid</button>
            <button class="btn secondary" id="clearBtn">Clear</button>
          </div>
        </div>

        <div class="stage">
          <div class="paper" id="canvasWrap">
            <canvas id="paper" width="1200" height="800"></canvas>
            <canvas id="overlay" width="1200" height="800"></canvas>
            <svg id="vectorLayer" viewBox="0 0 1200 800" preserveAspectRatio="none" aria-label="Editable vector artwork"></svg>
            <canvas id="guides" width="1200" height="800"></canvas>
            <canvas id="rulers" width="1200" height="800"></canvas>
          </div>
        </div>
      </section>

      <aside class="panel rightpanel">
        <h2>Inspector</h2>

        <div class="field">
          <label for="colorInput">Ink color</label>
          <input type="color" id="colorInput" value="#20252b">
        </div>

        <div class="field">
          <label for="sizeInput">Brush size</label>
          <input type="range" id="sizeInput" min="1" max="50" value="4">
          <div class="status"><strong id="sizeValue">4px</strong></div>
        </div>

        <label class="check"><input type="checkbox" id="fillToggle"> Fill shapes</label>
        <label class="check"><input type="checkbox" id="snapCheck"> Snap to guides</label>

        <div class="separator"></div>

        <div class="field">
          <label for="fontSelect">Font</label>
          <select id="fontSelect">
            <option value="sans-serif">Default</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </div>

        <div class="field">
          <label for="ghostOpacity">Ghost opacity</label>
          <input type="range" id="ghostOpacity" min="0.05" max="1" step="0.05" value="0.35">
        </div>
      </aside>
    </main>

    <div class="footer">
      <span id="toolStatus"><strong>Tool:</strong> Pencil</span>
      <span id="coordStatus">0 × 0 px</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js" defer></script>
</body>
</html>
