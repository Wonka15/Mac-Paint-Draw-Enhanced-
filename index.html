<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="description" content="A friendly, classic-Mac-inspired paint and drawing studio for the modern web.">
  <title>Mac paint/draw enhanced</title>
  <style>
    :root{
      --paper:#f4f0e7;
      --panel:#fffdf8;
      --ink:#20252b;
      --muted:#74736f;
      --line:#d6d0c4;
      --blue:#315cdb;
      --blue2:#e8edff;
      --shadow:0 8px 24px rgba(52,43,27,.12);
    }

    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--paper);
      color:var(--ink);
      font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    button,input,select{font:inherit}
    button{cursor:pointer}

    .app{
      max-width:1600px;
      margin:0 auto;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      gap:12px;
      padding:14px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:10px 14px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow)
    }

    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .mark{
      width:40px;height:40px;border:2px solid var(--ink);border-radius:9px;
      display:grid;place-items:center;background:#fff;box-shadow:inset -5px -5px 0 #e8e2d7;
      font-size:22px
    }
    .brand h1{font-size:16px;margin:0;font-weight:750;letter-spacing:-.4px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12px}

    .actions,.controlrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

    .btn,.tool{
      font:inherit;color:var(--ink);border:1px solid var(--line);background:#fffdf8;
      border-radius:8px;padding:8px 11px;cursor:pointer;transition:background .15s,border-color .15s;
      touch-action:manipulation;
    }
    .btn:hover,.tool:hover{background:#f2eee4;border-color:#aaa294}
    .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
    .btn:disabled{opacity:.38;cursor:not-allowed}

    .workspace{
      display:grid;
      grid-template-columns:210px minmax(0,1fr) 235px;
      gap:12px;
      flex:1;
      min-height:500px;
    }

    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:var(--shadow);
      padding:13px;
      min-width:0;
    }
    .panel h2{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:3px 0 11px}

    .toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .tool{min-height:65px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12px}
    .tool .ico{font-size:21px;line-height:1}
    .tool.active{background:var(--blue2);border-color:#8ba1f1;color:#193da8;box-shadow:inset 0 0 0 1px #a9b9ff}

    .separator{height:1px;background:var(--line);margin:14px 0}

    .canvas-shell{display:flex;flex-direction:column;min-width:0;gap:9px}
    .canvasbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
    .canvasbar .hint{color:var(--muted);font-size:12px}

    .stage{
      position:relative;
      flex:1;
      min-height:420px;
      border:1px solid #d3cbbc;
      border-radius:14px;
      overflow:hidden;
      background-color:#e9e4d9;
      background-image:radial-gradient(#c8c0b1 0.7px,transparent 0.7px);
      background-size:15px 15px;
      display:grid;
      place-items:center;
      padding:18px;
    }

    .paper{
      position:relative;
      width:min(100%,900px);
      height:min(72vh,640px);
      min-height:340px;
      background:white;
      box-shadow:0 8px 32px rgba(48,41,29,.14);
      border:1px solid #d8d8d8;
      overflow:hidden;
      touch-action:none;
    }

    .paper canvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      touch-action:none;
      background:transparent;
    }
    #paper{z-index:2}
    #overlay{z-index:3;pointer-events:none}
    #guides{z-index:4;pointer-events:none}
    #rulers{z-index:5;pointer-events:none}

    .field{display:flex;flex-direction:column;gap:5px;margin:11px 0}
    .field label{font-size:12px;color:var(--muted)}
    input[type=color]{width:100%;height:37px;border:1px solid var(--line);border-radius:8px;padding:3px;background:white}
    input[type=range]{width:100%;accent-color:var(--blue)}
    input[type=number],select,input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font:inherit}
    .check{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:13px}
    .check input{accent-color:var(--blue)}

    .palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
    .swatch{height:25px;border:1px solid rgba(0,0,0,.2);border-radius:6px;cursor:pointer}
    .swatch:focus{outline:2px solid var(--blue);outline-offset:2px}

    .status{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;padding:0 3px}
    .status strong{font-weight:600;color:#4b4c4c}

    .footer{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;padding:0 4px}

    .toast {
      position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#222831;
      color:#fff;padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);z-index:20;
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .toast.show{opacity:1}

    @media (max-width:1050px){
      .workspace{grid-template-columns:180px minmax(0,1fr)}
      .rightpanel{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
      .rightpanel h2{grid-column:1/-1}
    }

    @media (max-width:700px){
      .app{padding:8px;gap:8px}
      .topbar{align-items:flex-start;padding:9px}
      .brand p{display:none}
      .brand h1{font-size:14px}
      .mark{width:34px;height:34px}
      .actions .secondary{display:none}
      .workspace{display:flex;flex-direction:column;min-height:0}
      .toolgrid{grid-template-columns:repeat(4,1fr)}
      .tool{min-height:58px;padding:5px 2px}
      .stage{min-height:390px;padding:10px}
      .paper{height:54vh;min-height:300px}
      .canvasbar{padding:8px}
      .canvasbar .hint{display:none}
      .rightpanel{padding:11px}
      .footer{font-size:10px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">✎</div>
        <div>
          <h1>Mac paint/draw enhanced</h1>
          <p>A little classic Mac magic. A lot more room to create.</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn secondary" id="newBtn">＋ New</button>
        <button class="btn secondary" id="undoBtn" disabled>↶ Undo</button>
        <button class="btn secondary" id="redoBtn" disabled>↷ Redo</button>
        <button class="btn primary" id="exportBtn">Export PNG ↗</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel leftpanel">
        <h2>Toolbox</h2>
        <div class="toolgrid" id="toolgrid">
          <button class="tool active" data-tool="pencil"><span class="ico">✎</span>Pencil</button>
          <button class="tool" data-tool="eraser"><span class="ico">▱</span>Eraser</button>
          <button class="tool" data-tool="line"><span class="ico">／</span>Line</button>
          <button class="tool" data-tool="rect"><span class="ico">▱</span>Rectangle</button>
          <button class="tool" data-tool="ellipse"><span class="ico">◯</span>Oval</button>
          <button class="tool" data-tool="text"><span class="ico">T</span>Text</button>
          <button class="tool" data-tool="eyedropper"><span class="ico">◉</span>Pick color</button>
          <button class="tool" data-tool="hand"><span class="ico">✋</span>Pan / guide</button>
        </div>

        <div class="separator"></div>

        <h2>Quick palette</h2>
        <div class="palette" id="palette">
          <button class="swatch" style="background:#20252b" data-color="#20252b" aria-label="Ink black"></button>
          <button class="swatch" style="background:#ffffff" data-color="#ffffff" aria-label="White"></button>
          <button class="swatch" style="background:#d84b42" data-color="#d84b42" aria-label="Red"></button>
          <button class="swatch" style="background:#ed9c35" data-color="#ed9c35" aria-label="Orange"></button>
          <button class="swatch" style="background:#f0cf4c" data-color="#f0cf4c" aria-label="Yellow"></button>
          <button class="swatch" style="background:#4d956d" data-color="#4d956d" aria-label="Green"></button>
          <button class="swatch" style="background:#48a7bc" data-color="#48a7bc" aria-label="Teal"></button>
          <button class="swatch" style="background:#426bd6" data-color="#426bd6" aria-label="Blue"></button>
          <button class="swatch" style="background:#9271c7" data-color="#9271c7" aria-label="Purple"></button>
          <button class="swatch" style="background:#000000" data-color="#000000" aria-label="Black"></button>
          <button class="swatch" style="background:#7a7a7a" data-color="#7a7a7a" aria-label="Gray"></button>
          <button class="swatch" style="background:#f1d4c5" data-color="#f1d4c5" aria-label="Pink"></button>
        </div>
      </aside>

      <section class="canvas-shell">
        <div class="canvasbar">
          <div><strong id="docTitle">Untitled drawing</strong> <span class="hint">· Your canvas</span></div>
          <div class="controlrow">
            <button class="btn secondary" id="guidesBtn">Guides</button>
            <button class="btn secondary" id="gridBtn">Grid</button>
            <button class="btn secondary" id="clearBtn">Clear</button>
          </div>
        </div>

        <div class="stage">
          <div class="paper" id="canvasWrap">
            <canvas id="paper" width="1200" height="800"></canvas>
            <canvas id="overlay" width="1200" height="800"></canvas>
            <canvas id="guides" width="1200" height="800"></canvas>
            <canvas id="rulers" width="1200" height="800"></canvas>
          </div>
        </div>
      </section>

      <aside class="panel rightpanel">
        <h2>Inspector</h2>

        <div class="field">
          <label for="colorInput">Ink color</label>
          <input type="color" id="colorInput" value="#20252b">
        </div>

        <div class="field">
          <label for="sizeInput">Brush size</label>
          <input type="range" id="sizeInput" min="1" max="50" value="4">
          <div class="status"><strong id="sizeValue">4px</strong></div>
        </div>

        <label class="check"><input type="checkbox" id="fillToggle"> Fill shapes</label>
        <label class="check"><input type="checkbox" id="snapCheck"> Snap to guides</label>

        <div class="separator"></div>

        <div class="field">
          <label for="fontSelect">Font</label>
          <select id="fontSelect">
            <option value="sans-serif">Default</option>
            <option value="serif">Serif</option>
            <option value="monospace">Monospace</option>
          </select>
        </div>

        <div class="field">
          <label for="ghostOpacity">Ghost opacity</label>
          <input type="range" id="ghostOpacity" min="0.05" max="1" step="0.05" value="0.35">
        </div>
      </aside>
    </main>

    <div class="footer">
      <span id="toolStatus"><strong>Tool:</strong> Pencil</span>
      <span id="coordStatus">0 × 0 px</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const $ = (id) => document.getElementById(id);
      const paper = $('paper');
      const overlay = $('overlay');
      const guides = $('guides');
      const rulers = $('rulers');
      const ctx = paper.getContext('2d');
      const octx = overlay.getContext('2d');
      const gctx = guides.getContext('2d');
      const rctx = rulers.getContext('2d');

      let tool = 'pencil';
      let color = '#20252b';
      let size = 4;
      let fill = false;
      let drawing = false;
      let start = null;
      let last = null;
      let history = [];
      let redoStack = [];
      let guideX = null;
      let guideY = null;
      let showGuides = false;
      let showGrid = false;
      let showRulers = false;
      let saveTimer = null;
      let ghostImage = null;
      let ghostOpacity = 0.35;
      let currentFont = 'sans-serif';

      const W = () => paper.width;
      const H = () => paper.height;

      function toast(msg){
        const t = $('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(()=>t.classList.remove('show'), 1800);
      }

      function setStatus(){
        const labels = {
          pencil: 'Pencil',
          eraser: 'Eraser',
          line: 'Line',
          rect: 'Rectangle',
          ellipse: 'Oval',
          text: 'Text',
          eyedropper: 'Pick color',
          hand: 'Pan / guide'
        };
        $('toolStatus').innerHTML = '<strong>Tool:</strong> ' + (labels[tool] || tool);
      }

      function selectTool(nextTool){
        tool = nextTool;
        document.querySelectorAll('.tool').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.tool === nextTool);
        });
        setStatus();
      }

      function point(event){
        const rect = paper.getBoundingClientRect();
        let x = ((event.clientX - rect.left) * W()) / rect.width;
        let y = ((event.clientY - rect.top) * H()) / rect.height;

        if ($('snapCheck').checked) {
          if (guideX !== null && Math.abs(x - guideX) < 14) x = guideX;
          if (guideY !== null && Math.abs(y - guideY) < 14) y = guideY;
        }

        return {
          x: Math.max(0, Math.min(W() - 1, x)),
          y: Math.max(0, Math.min(H() - 1, y))
        };
      }

      function snapshot(){
        try {
          history.push(ctx.getImageData(0, 0, W(), H()));
          if (history.length > 40) history.shift();
          redoStack = [];
          updateUndo();
          scheduleSave();
        } catch (err) {
          console.warn('snapshot failed', err);
        }
      }

      function updateUndo(){
        $('undoBtn').disabled = history.length === 0;
        $('redoBtn').disabled = redoStack.length === 0;
      }

      function drawRulers(){
        rctx.clearRect(0, 0, W(), H());
        if (!showRulers) {
          rulers.style.display = 'none';
          return;
        }

        rulers.style.display = 'block';
        rctx.save();
        rctx.strokeStyle = 'rgba(30,35,41,0.55)';
        rctx.fillStyle = 'rgba(30,35,41,0.8)';
        rctx.font = '10px sans-serif';
        rctx.lineWidth = 1;

        for (let x = 0; x <= W(); x += 50) {
          rctx.beginPath();
          rctx.moveTo(x, 0);
          rctx.lineTo(x, 18);
          rctx.stroke();
          rctx.fillText(String(x), x + 4, 12);
        }

        for (let y = 0; y <= H(); y += 50) {
          rctx.beginPath();
          rctx.moveTo(0, y);
          rctx.lineTo(18, y);
          rctx.stroke();
          rctx.fillText(String(y), 4, y + 12);
        }

        rctx.restore();
      }

      function drawGuides(){
        gctx.clearRect(0, 0, W(), H());

        if (showGrid) {
          gctx.save();
          gctx.strokeStyle = 'rgba(100,130,220,0.18)';
          gctx.lineWidth = 1;
          for (let x = 50; x < W(); x += 50) {
            gctx.beginPath();
            gctx.moveTo(x, 0);
            gctx.lineTo(x, H());
            gctx.stroke();
          }
          for (let y = 50; y < H(); y += 50) {
            gctx.beginPath();
            gctx.moveTo(0, y);
            gctx.lineTo(W(), y);
            gctx.stroke();
          }
          gctx.restore();
        }

        if (showGuides) {
          gctx.save();
          gctx.strokeStyle = '#315cdb';
          gctx.lineWidth = 1;
          gctx.setLineDash([5, 5]);
          if (guideX !== null) {
            gctx.beginPath();
            gctx.moveTo(guideX, 0);
            gctx.lineTo(guideX, H());
            gctx.stroke();
          }
          if (guideY !== null) {
            gctx.beginPath();
            gctx.moveTo(0, guideY);
            gctx.lineTo(W(), guideY);
            gctx.stroke();
          }
          gctx.restore();
        }

        guides.style.display = (showGuides || showGrid) ? 'block' : 'none';
        drawRulers();
      }

      function scheduleSave(){
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            const saved = {
              w: W(),
              h: H(),
              image: paper.toDataURL('image/png'),
              color,
              size,
              tool
            };
            localStorage.setItem('mpde-art', JSON.stringify(saved));
          } catch (err) {
            console.warn('save failed', err);
          }
        }, 250);
      }

      function restore(){
        try {
          const saved = JSON.parse(localStorage.getItem('mpde-art'));
          if (!saved || !saved.image) return;
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, W(), H());
            ctx.drawImage(img, 0, 0, W(), H());
            if (saved.color) color = saved.color;
            if (saved.size) size = saved.size;
            if (saved.tool) tool = saved.tool;
            $('colorInput').value = color;
            $('sizeInput').value = String(size);
            $('sizeValue').textContent = `${size}px`;
            setStatus();
            selectTool(tool);
          };
          img.src = saved.image;
        } catch (err {
          console.warn('restore failed', err);
        }
      }

      function drawShape(currentPoint){
        octx.clearRect(0, 0, W(), H());
        octx.save();
        octx.strokeStyle = color;
        octx.fillStyle = color;
        octx.lineWidth = size;
        octx.lineCap = 'round';
        octx.lineJoin = 'round';

        const left = Math.min(start.x, currentPoint.x);
        const top = Math.min(start.y, currentPoint.y);
        const width = Math.abs(start.x - currentPoint.x);
        const height = Math.abs(start.y - currentPoint.y);

        if (tool === 'line') {
          octx.beginPath();
          octx.moveTo(start.x, start.y);
          octx.lineTo(currentPoint.x, currentPoint.y);
          octx.stroke();
        } else if (tool === 'rect') {
          if (fill) {
            octx.fillRect(left, top, width, height);
          } else {
            octx.strokeRect(left, top, width, height);
          }
        } else if (tool === 'ellipse') {
          octx.beginPath();
          octx.ellipse(left + width / 2, top + height / 2, width / 2, height / 2, 0, 0, Math.PI * 2);
          if (fill) octx.fill();
          else octx.stroke();
        }

        octx.restore();
      }

      function pointerDown(event){
        event.preventDefault();
        const p = point(event);
        $('coordStatus').textContent = `${Math.round(p.x)} × ${Math.round(p.y)} px`;

        if (tool === 'text') {
          const label = prompt('What would you like to write?');
          if (!label) return;
          snapshot();
          ctx.fillStyle = color;
          ctx.font = `${size * 2}px ${currentFont}`;
          ctx.fillText(label, p.x, p.y);
          scheduleSave();
          toast('Text added');
          return;
        }

        if (tool === 'eyedropper') {
          const data = ctx.getImageData(Math.floor(p.x), Math.floor(p.y), 1, 1).data;
          const [r, g, b] = data;
          color = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
          $('colorInput').value = color;
          toast('Color picked');
          return;
        }

        if (tool === 'hand') {
          guideX = p.x;
          guideY = p.y;
          showGuides = true;
          drawGuides();
          toast('Guide placed');
          return;
        }

        drawing = true;
        start = p;
        last = p;
        snapshot();
      }

      function pointerMove(event){
        if (!drawing) return;
        const p = point(event);
        $('coordStatus').textContent = `${Math.round(p.x)} × ${Math.round(p.y)} px`;

        if (tool === 'pencil' || tool === 'eraser') {
          ctx.beginPath();
          ctx.moveTo(last.x, last.y);
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
          ctx.lineWidth = size;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
          last = p;
        } else if (['line', 'rect', 'ellipse'].includes(tool)) {
          drawShape(p);
        }
      }

      function pointerUp(event){
        if (!drawing) return;
        drawing = false;

        if (['line', 'rect', 'ellipse'].includes(tool)) {
          ctx.drawImage(overlay, 0, 0);
          octx.clearRect(0, 0, W(), H());
        }

        if (event) {
          const p = point(event);
          $('coordStatus').textContent = `${Math.round(p.x)} × ${Math.round(p.y)} px`;
        }

        scheduleSave();
      }

      document.querySelectorAll('.tool').forEach((button) => {
        button.addEventListener('click', () => selectTool(button.dataset.tool));
      });

      document.querySelectorAll('.swatch').forEach((button) => {
        button.addEventListener('click', () => {
          color = button.dataset.color;
          $('colorInput').value = color;
          toast('Color selected');
        });
      });

      $('colorInput').addEventListener('input', (event) => {
        color = event.target.value;
      });

      $('sizeInput').addEventListener('input', (event) => {
        size = Number(event.target.value);
        $('sizeValue').textContent = `${size}px`;
      });

      $('fillToggle').addEventListener('change', (event) => {
        fill = event.target.checked;
      });

      $('guidesBtn').addEventListener('click', () => {
        showGuides = !showGuides;
        if (showGuides && guideX === null && guideY === null) {
          guideX = Math.round(W() / 2);
          guideY = Math.round(H() / 2);
        }
        drawGuides();
      });

      $('gridBtn').addEventListener('click', () => {
        showGrid = !showGrid;
        drawGuides();
      });

      $('clearBtn').addEventListener('click', () => {
        if (!confirm('Clear the whole canvas?')) return;
        snapshot();
        ctx.clearRect(0, 0, W(), H);
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W(), H());
        scheduleSave();
        toast('Canvas cleared');
      });

      $('undoBtn').addEventListener('click', () => {
        if (!history.length) return;
        redoStack.push(ctx.getImageData(0, 0, W(), H()));
        ctx.putImageData(history.pop(), 0, 0);
        updateUndo();
        scheduleSave();
        toast('Undid action');
      });

      $('redoBtn').addEventListener('click', () => {
        if (!redoStack.length) return;
        history.push(ctx.getImageData(0, 0, W(), H()));
        ctx.putImageData(redoStack.pop(), 0, 0);
        updateUndo();
        scheduleSave();
        toast('Redid action');
      });

      $('newBtn').addEventListener('click', () => {
        const ok = confirm('Start a new drawing?');
        if (!ok) return;
        snapshot();
        ctx.clearRect(0, 0, W(), H());
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W(), H());
        scheduleSave();
      });

      $('exportBtn').addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'drawing.png';
        link.href = paper.toDataURL('image/png');
        link.click();
        toast('PNG exported');
      });

      $('fontSelect').addEventListener('change', (event) => {
        currentFont = event.target.value;
      });

      $('ghostOpacity').addEventListener('input', (event) => {
        ghostOpacity = Number(event.target.value);
      });

      paper.addEventListener('pointerdown', pointerDown);
      paper.addEventListener('pointermove', pointerMove);
      paper.addEventListener('pointerup', pointerUp);
      paper.addEventListener('pointercancel', pointerUp);
      paper.addEventListener('pointerleave', pointerUp);

      function init(){
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W(), H());
        setStatus();
        drawGuides();
        updateUndo();
        restore();
      }

      init();
    })();
  </script>
</body>
</html>
