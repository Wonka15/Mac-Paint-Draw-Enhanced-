<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f4f0e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mac Paint">
  <meta name="description" content="A friendly, classic-Mac-inspired paint and drawing studio for the modern web.">
  <title>Mac Paint Draw Enhanced</title>
  
  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23f4f0e7' width='192' height='192'/><path d='M48 144L96 48L144 144Z' fill='%2320252b'/><circle cx='96' cy='80' r='12' fill='%23315cdb'/></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23f4f0e7' width='192' height='192' rx='45'/><path d='M48 144L96 48L144 144Z' fill='%2320252b'/><circle cx='96' cy='80' r='12' fill='%23315cdb'/></svg>">
  
  <style>
    :root {
      --paper: #f4f0e7;
      --panel: #fffdf8;
      --ink: #20252b;
      --muted: #74736f;
      --line: #d6d0c4;
      --blue: #315cdb;
      --blue2: #e8edff;
      --green: #2d8f3a;
      --red: #d63031;
      --shadow: 0 8px 24px #342b1b12;
      --shadow-sm: 0 2px 6px #342b1b08;
    }

    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Header */
    .topbar {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      min-height: 56px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .mark {
      font-size: 20px;
      flex-shrink: 0;
    }

    .brand > div:last-child {
      min-width: 0;
      overflow: hidden;
    }

    .brand h1 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand p {
      margin: 0;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* Workspace */
    .workspace {
      display: flex;
      gap: 8px;
      flex: 1;
      min-height: 0;
      padding: 8px;
      overflow: hidden;
    }

    /* Panels */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      overflow-y: auto;
      font-size: 12px;
    }

    .panel h2 {
      margin: 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
    }

    .leftpanel {
      width: 140px;
      flex-shrink: 0;
    }

    .rightpanel {
      width: 140px;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      .leftpanel, .rightpanel {
        display: none;
      }
      .workspace {
        padding: 0;
      }
    }

    /* Canvas */
    .canvas-shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .canvasbar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      font-size: 12px;
    }

    .canvasbar > div:first-child {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #docTitle {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hint {
      color: var(--muted);
    }

    .controlrow {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    #paper {
      flex: 1;
      cursor: crosshair;
      display: block;
      width: 100%;
      height: 100%;
      background: white;
    }

    /* Buttons */
    .btn {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover {
      background: #f9f7f2;
      border-color: var(--muted);
    }

    .btn:active {
      transform: scale(0.96);
      background: var(--line);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.primary {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .btn.primary:hover {
      background: #2849b5;
    }

    .btn.success {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }

    .btn.danger {
      background: var(--red);
      color: white;
      border-color: var(--red);
    }

    /* Tool Grid */
    .toolgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .tool {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px;
      font-size: 10px;
      font-weight: 500;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tool:hover {
      background: #f9f7f2;
      border-color: var(--blue);
    }

    .tool.active {
      background: var(--blue2);
      border-color: var(--blue);
      font-weight: 600;
    }

    .tool .ico {
      font-size: 14px;
    }

    /* Palette */
    .palette {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .swatch:hover {
      transform: scale(1.1);
    }

    .swatch:focus {
      border-color: var(--blue);
    }

    /* Separator */
    .separator {
      height: 1px;
      background: var(--line);
      margin: 4px 0;
    }

    /* Field */
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--muted);
    }

    .field input[type="range"],
    .field input[type="color"],
    .field input[type="checkbox"] {
      cursor: pointer;
    }

    .field input[type="range"] {
      width: 100%;
    }

    /* Status Bar */
    .statusbar {
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Footer */
    .footer {
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 8px 16px;
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--ink);
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      pointer-events: none;
      z-index: 1000;
      transition: transform 0.3s ease;
      box-shadow: var(--shadow);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(32, 37, 43, 0.4);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      box-shadow: var(--shadow);
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .modal-body {
      margin-bottom: 16px;
      font-size: 12px;
      color: var(--ink);
    }

    .modal-body input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px;
      margin-top: 6px;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .topbar {
        padding: 8px 12px;
        min-height: 48px;
      }

      .brand h1 {
        font-size: 12px;
      }

      .brand p {
        display: none;
      }

      .mark {
        font-size: 16px;
      }

      .btn {
        padding: 4px 8px;
        font-size: 10px;
      }

      .canvasbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .controlrow {
        width: 100%;
      }

      .footer {
        font-size: 9px;
        padding: 6px 12px;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">✎</div>
        <div>
          <h1>Mac Paint Enhanced</h1>
          <p>Draw, create, save</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn" id="saveBtn" title="Save drawing">💾 Save</button>
        <button class="btn" id="exportBtn" title="Export as PNG">📥 Export</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="panel leftpanel">
        <h2>Toolbox</h2>
        <div class="toolgrid" id="toolgrid">
          <button class="tool active" data-tool="pencil"><span class="ico">✎</span> Pencil</button>
          <button class="tool" data-tool="eraser"><span class="ico">▱</span> Eraser</button>
          <button class="tool" data-tool="line"><span class="ico">/</span> Line</button>
          <button class="tool" data-tool="rect"><span class="ico">□</span> Box</button>
          <button class="tool" data-tool="ellipse"><span class="ico">◯</span> Oval</button>
          <button class="tool" data-tool="text"><span class="ico">T</span> Text</button>
          <button class="tool" data-tool="eyedropper"><span class="ico">◉</span> Pick</button>
          <button class="tool" data-tool="hand"><span class="ico">✋</span> Pan</button>
        </div>

        <div class="separator"></div>

        <h2>Quick Palette</h2>
        <div class="palette" id="palette">
          <button class="swatch" style="background:#20252b" data-color="#20252b" aria-label="Ink black"></button>
          <button class="swatch" style="background:#ffffff" data-color="#ffffff" aria-label="White"></button>
          <button class="swatch" style="background:#e74c3c" data-color="#e74c3c" aria-label="Red"></button>
          <button class="swatch" style="background:#3498db" data-color="#3498db" aria-label="Blue"></button>
          <button class="swatch" style="background:#2ecc71" data-color="#2ecc71" aria-label="Green"></button>
          <button class="swatch" style="background:#f39c12" data-color="#f39c12" aria-label="Orange"></button>
          <button class="swatch" style="background:#9b59b6" data-color="#9b59b6" aria-label="Purple"></button>
          <button class="swatch" style="background:#34495e" data-color="#34495e" aria-label="Dark gray"></button>
        </div>

        <div class="separator"></div>

        <div class="field">
          <button class="btn" id="undoBtn">↶ Undo</button>
        </div>
        <div class="field">
          <button class="btn" id="redoBtn">↷ Redo</button>
        </div>
        <div class="field">
          <button class="btn danger" id="clearBtn">🗑 Clear</button>
        </div>
      </aside>

      <section class="canvas-shell">
        <div class="canvasbar">
          <div>
            <strong id="docTitle">Untitled drawing</strong>
            <span class="hint">· Your canvas</span>
          </div>
          <div class="controlrow">
            <button class="btn" id="guidesBtn" aria-pressed="false">📐 Guides</button>
            <button class="btn" id="resetBtn">↻ Reset</button>
          </div>
        </div>
        <div style="position:relative; flex:1; overflow:hidden;">
          <canvas id="paper" width="1200" height="800"></canvas>
          <canvas id="art" style="position:absolute;top:0;left:0;cursor:crosshair;display:none" width="1200" height="800"></canvas>
          <canvas id="overlay" style="position:absolute;top:0;left:0;cursor:crosshair;display:none" width="1200" height="800"></canvas>
          <canvas id="guides" style="position:absolute;top:0;left:0;pointer-events:none;display:none" width="1200" height="800"></canvas>
        </div>
      </section>

      <aside class="panel rightpanel">
        <h2>Inspector</h2>

        <div class="field">
          <label for="colorInput">Ink Color</label>
          <input type="color" id="colorInput" value="#20252b">
        </div>

        <div class="field">
          <label for="sizeInput">Brush Size</label>
          <input type="range" id="sizeInput" min="1" max="50" value="4">
          <span id="sizeDisplay">4px</span>
        </div>

        <div class="field">
          <label for="fillCheck">
            <input type="checkbox" id="fillCheck">
            Fill shapes
          </label>
        </div>

        <div class="field">
          <label for="snapCheck">
            <input type="checkbox" id="snapCheck">
            Snap to guides
          </label>
        </div>

        <div class="field">
          <label for="gridCheck">
            <input type="checkbox" id="gridCheck">
            Show grid
          </label>
        </div>

        <div class="separator"></div>

        <div class="field">
          <button class="btn success" id="loadBtn">📂 Load</button>
        </div>
      </aside>
    </main>

    <div class="statusbar">
      <span id="toolStatus">Tool: Pencil</span>
      <span id="coordStatus">0 × 0 px</span>
    </div>

    <footer class="footer">
      <span>✨ Made for curious hands and happy accidents</span>
      <span>⚙️ Local-first · 🔒 No account · 🎨 Open source</span>
    </footer>
  </div>

  <div class="modal" id="saveModal">
    <div class="modal-content">
      <div class="modal-header">Save Drawing</div>
      <div class="modal-body">
        <label>Drawing name:</label>
        <input type="text" id="saveName" placeholder="My drawing">
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelSaveBtn">Cancel</button>
        <button class="btn primary" id="confirmSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (()=>{'use strict';

    const $ = id => document.getElementById(id);
    const paper = $('paper');
    const art = $('art');
    const overlay = $('overlay');
    const guides = $('guides');
    const ctx = paper.getContext('2d');
    const octx = overlay.getContext('2d');
    const gctx = guides.getContext('2d');

    let tool = 'pencil';
    let color = '#20252b';
    let size = 4;
    let fill = false;
    let drawing = false;
    let start = null;
    let last = null;
    let history = [];
    let redoStack = [];
    let showGuides = false;
    let showGrid = false;
    let showSafe = false;
    let guideX = null;
    let guideY = null;
    let saveTimer = null;
    let panX = 0;
    let panY = 0;

    const W = () => paper.width;
    const H = () => paper.height;

    function toast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => t.classList.remove('show'), 1800);
    }

    function setStatus() {
      const names = {
        pencil: 'Pencil',
        eraser: 'Eraser',
        line: 'Line',
        rect: 'Rectangle',
        ellipse: 'Oval',
        text: 'Text',
        eyedropper: 'Pick color',
        hand: 'Pan'
      };
      $('toolStatus').innerHTML = `<strong>Tool:</strong> ${names[tool] || tool}`;
    }

    function selectTool(t) {
      tool = t;
      document.querySelectorAll('.tool').forEach(b => b.classList.toggle('active', b.dataset.tool === t));
      setStatus();
    }

    function point(e) {
      const r = paper.getBoundingClientRect();
      let x = (e.clientX - r.left) * W() / r.width;
      let y = (e.clientY - r.top) * H() / r.height;
      if ($('snapCheck').checked) {
        if (guideX !== null && Math.abs(x - guideX) < 14) x = guideX;
        if (guideY !== null && Math.abs(y - guideY) < 14) y = guideY;
      }
      return { x: Math.max(0, Math.min(W() - 1, x)), y: Math.max(0, Math.min(H() - 1, y)) };
    }

    function snapshot() {
      try {
        history.push(ctx.getImageData(0, 0, W(), H()));
        if (history.length > 40) history.shift();
        redoStack = [];
        updateUndo();
        scheduleSave();
      } catch (e) {}
    }

    function updateUndo() {
      $('undoBtn').disabled = !history.length;
      $('redoBtn').disabled = !redoStack.length;
    }

    function resizeCanvas(w, h, preserve = true) {
      let old;
      if (preserve && W() && H()) {
        old = document.createElement('canvas');
        old.width = W();
        old.height = H();
        old.getContext('2d').drawImage(paper, 0, 0);
      }
      [paper, art, overlay, guides].forEach(c => {
        c.width = w;
        c.height = h;
      });
      if (old) ctx.drawImage(old, 0, 0);
      drawGuides();
    }

    function drawGuides() {
      gctx.clearRect(0, 0, W(), H());
      if (showGrid) {
        gctx.save();
        gctx.strokeStyle = '#6b8bd522';
        gctx.lineWidth = 1;
        for (let x = 50; x < W(); x += 50) {
          gctx.beginPath();
          gctx.moveTo(x, 0);
          gctx.lineTo(x, H());
          gctx.stroke();
        }
        for (let y = 50; y < H(); y += 50) {
          gctx.beginPath();
          gctx.moveTo(0, y);
          gctx.lineTo(W(), y);
          gctx.stroke();
        }
        gctx.restore();
      }
      if (showGuides) {
        gctx.save();
        gctx.strokeStyle = '#315cdb';
        gctx.lineWidth = 1;
        gctx.setLineDash([5, 5]);
        if (guideX !== null) {
          gctx.beginPath();
          gctx.moveTo(guideX, 0);
          gctx.lineTo(guideX, H());
          gctx.stroke();
        }
        if (guideY !== null) {
          gctx.beginPath();
          gctx.moveTo(0, guideY);
          gctx.lineTo(W(), guideY);
          gctx.stroke();
        }
        gctx.restore();
      }
      guides.style.display = (showGuides || showGrid) ? 'block' : 'none';
    }

    function scheduleSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try {
          localStorage.setItem('mpde-art', JSON.stringify({
            w: W(),
            h: H(),
            image: paper.toDataURL('image/png'),
            color,
            size,
            tool,
            guideX,
            guideY
          }));
        } catch (e) {}
      }, 500);
    }

    function restore() {
      try {
        const s = JSON.parse(localStorage.getItem('mpde-art'));
        if (s && s.image) {
          resizeCanvas(s.w, s.h, false);
          const img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0);
            color = s.color || color;
            size = s.size || size;
            tool = s.tool || tool;
            guideX = s.guideX || null;
            guideY = s.guideY || null;
            $('colorInput').value = color;
            $('sizeInput').value = size;
            $('sizeDisplay').textContent = size + 'px';
            selectTool(tool);
            drawGuides();
          };
          img.src = s.image;
        }
      } catch (e) {}
    }

    function drawShape(p) {
      octx.clearRect(0, 0, W(), H());
      octx.save();
      octx.strokeStyle = color;
      octx.fillStyle = color;
      octx.lineWidth = size;
      octx.lineCap = 'round';
      octx.lineJoin = 'round';
      const x = Math.min(start.x, p.x);
      const y = Math.min(start.y, p.y);
      const w = Math.abs(start.x - p.x);
      const h = Math.abs(start.y - p.y);
      if (tool === 'line') {
        octx.beginPath();
        octx.moveTo(start.x, start.y);
        octx.lineTo(p.x, p.y);
        octx.stroke();
      } else if (tool === 'rect') {
        if (fill) octx.fillRect(x, y, w, h);
        else octx.strokeRect(x, y, w, h);
      } else if (tool === 'ellipse') {
        octx.beginPath();
        octx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, 2 * Math.PI);
        if (fill) octx.fill();
        else octx.stroke();
      }
      octx.restore();
    }

    function pointerDown(e) {
      e.preventDefault();
      const p = point(e);
      $('coordStatus').textContent = `${Math.round(p.x)} × ${Math.round(p.y)} px`;
      if (tool === 'text') {
        const text = prompt('What would you like to write?');
        if (text) {
          snapshot();
          ctx.fillStyle = color;
          ctx.font = `${size * 2}px sans-serif`;
          ctx.fillText(text, p.x, p.y);
          scheduleSave();
        }
        return;
      }
      if (tool === 'hand') return;
      if (tool === 'eyedropper') {
        const imageData = ctx.getImageData(p.x, p.y, 1, 1);
        const [r, g, b] = imageData.data;
        color = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
        $('colorInput').value = color;
        toast('Color picked!');
        return;
      }
      drawing = true;
      start = p;
      last = p;
      snapshot();
    }

    function pointerMove(e) {
      if (!drawing) return;
      const p = point(e);
      $('coordStatus').textContent = `${Math.round(p.x)} × ${Math.round(p.y)} px`;
      if (tool === 'pencil' || tool === 'eraser') {
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = tool === 'eraser' ? 'white' : color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        last = p;
      } else if (['line', 'rect', 'ellipse'].includes(tool)) {
        drawShape(p);
      }
    }

    function pointerUp(e) {
      if (!drawing) return;
      drawing = false;
      const p = point(e);
      if (['line', 'rect', 'ellipse'].includes(tool)) {
        ctx.drawImage(overlay, 0, 0);
        octx.clearRect(0, 0, W(), H());
        scheduleSave();
      }
      if (tool === 'pencil' || tool === 'eraser') {
        scheduleSave();
      }
    }

    // Event Listeners
    paper.addEventListener('pointerdown', pointerDown);
    paper.addEventListener('pointermove', pointerMove);
    paper.addEventListener('pointerup', pointerUp);
    paper.addEventListener('pointercancel', pointerUp);

    document.querySelectorAll('.tool').forEach(btn => {
      btn.addEventListener('click', () => selectTool(btn.dataset.tool));
    });

    document.querySelectorAll('.swatch').forEach(btn => {
      btn.addEventListener('click', () => {
        color = btn.dataset.color;
        $('colorInput').value = color;
      });
    });

    $('colorInput').addEventListener('input', (e) => {
      color = e.target.value;
    });

    $('sizeInput').addEventListener('input', (e) => {
      size = parseInt(e.target.value);
      $('sizeDisplay').textContent = size + 'px';
    });

    $('fillCheck').addEventListener('change', (e) => {
      fill = e.target.checked;
    });

    $('guidesBtn').addEventListener('click', () => {
      showGuides = !showGuides;
      $('guidesBtn').setAttribute('aria-pressed', showGuides);
      if (showGuides && guideX === null && guideY === null) {
        guideX = Math.round(W() / 2);
        guideY = Math.round(H() / 2);
      }
      drawGuides();
    });

    $('gridCheck').addEventListener('change', (e) => {
      showGrid = e.target.checked;
      drawGuides();
    });

    $('undoBtn').addEventListener('click', () => {
      if (!history.length) return;
      redoStack.push(ctx.getImageData(0, 0, W(), H()));
      ctx.putImageData(history.pop(), 0, 0);
      updateUndo();
      scheduleSave();
      toast('Undid action');
    });

    $('redoBtn').addEventListener('click', () => {
      if (!redoStack.length) return;
      history.push(ctx.getImageData(0, 0, W(), H()));
      ctx.putImageData(redoStack.pop(), 0, 0);
      updateUndo();
      scheduleSave();
      toast('Redid action');
    });

    $('clearBtn').addEventListener('click', () => {
      if (!confirm('Clear the whole canvas? You can undo this.')) return;
      snapshot();
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W(), H());
      scheduleSave();
      toast('Canvas cleared');
    });

    $('resetBtn').addEventListener('click', () => {
      if (!confirm('Reset canvas size to 1200×800?')) return;
      resizeCanvas(1200, 800, true);
      toast('Canvas reset');
    });

    $('saveBtn').addEventListener('click', () => {
      $('saveModal').classList.add('show');
      $('saveName').focus();
    });

    $('cancelSaveBtn').addEventListener('click', () => {
      $('saveModal').classList.remove('show');
    });

    $('confirmSaveBtn').addEventListener('click', () => {
      const name = $('saveName').value || 'drawing';
      const link = document.createElement('a');
      link.href = paper.toDataURL('image/png');
      link.download = `${name}-${Date.now()}.png`;
      link.click();
      toast(`Saved: ${name}`);
      $('saveModal').classList.remove('show');
      $('saveName').value = '';
    });

    $('exportBtn').addEventListener('click', () => {
      const link = document.createElement('a');
      link.href = paper.toDataURL('image/png');
      link.download = `mac-paint-${Date.now()}.png`;
      link.click();
      toast('Exported as PNG');
    });

    $('loadBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            snapshot();
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, W(), H());
            const scale = Math.min(W() / img.width, H() / img.height);
            const x = (W() - img.width * scale) / 2;
            const y = (H() - img.height * scale) / 2;
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
            scheduleSave();
            toast('Image loaded');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
      input.click();
    });

    // Initialize
    resizeCanvas(1200, 800, false);
    restore();

    })();
  </script>
</body>
</html>
